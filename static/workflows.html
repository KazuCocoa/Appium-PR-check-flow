<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow builder · Appium PR Check Flow</title>
  <link rel="stylesheet" href="/static/review.css">
  <script src="/static/stream.js" defer></script>
  <script src="/static/workflows.js" defer></script>
</head>
<body>
<header><b>Appium</b><span> / </span>PR Check Flow</header>
<main>
  <a href="/">Back to pull request review</a>
  <h1>Workflow builder</h1>
  <form id="builder">
    <label>Saved workflows<select id="saved"><option value="">New workflow</option></select></label>
    <label>Workflow name<input id="name" value="Compatibility review" required maxlength="80"></label>
    <fieldset><legend>Agents in execution order</legend>
      <div id="steps"></div>
      <button type="button" id="add">Add agent</button>
    </fieldset>
    <button type="button" id="save">Save workflow</button>
    <fieldset><legend>Pull request</legend>
      <label>Repository<input id="repo" required value="appium/appium"></label>
      <label>PR number<input id="number" type="number" min="1" required></label>
      <label>Provider<select id="provider"><option value="ollama">Ollama (local)</option><option value="openai">OpenAI API</option></select></label>
    </fieldset>
    <button id="run" disabled>Run workflow</button>
  </form>
  <p role="status" id="status">Loading agents…</p>
  <section id="result" hidden>
    <h2>Report</h2><article id="report"></article>
    <h2>Stage inputs and outputs</h2><div id="inspect"></div>
    <label>Evaluation notes<textarea id="notes" rows="3"></textarea></label>
    <button type="button" id="download">Download run and notes</button>
  </section>
</main>
</body>
</html>
