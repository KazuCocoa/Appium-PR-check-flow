<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appium PR Check Flow</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
    body { max-width: 800px; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.55; }
    textarea { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; }
    button { padding: 10px 20px; cursor: pointer; margin-top: 8px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: rgba(127,127,127,.12); border-radius: 8px; }
    .note { opacity: .7; }
  </style>
</head>
<body>
  <h1>Appium PR Check Flow</h1>
  <p class="note">Local read-only agent. Outputs are not guaranteed code reviews.</p>
  <form id="ask-form">
    <label for="question">Ask about a GitHub PR</label>
    <textarea id="question" rows="4" maxlength="2000" required>Summarize the open PRs in appium/appium</textarea>
    <label for="provider">LLM provider</label>
    <select id="provider"><option value="ollama" selected>Ollama (local)</option><option value="openai">OpenAI API</option></select>
    <button id="submit" type="submit">Ask Agent</button>
  </form>
  <hr>
  <h2>Evidence-based staged review</h2>
  <p class="note">Scout → Reviewer → Verifier. No CI verification or GitHub posting.</p>
  <form id="review-form">
    <label for="review-repo">Repository</label>
    <input id="review-repo" value="appium/appium" required pattern="[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+">
    <label for="review-number">PR number</label>
    <input id="review-number" type="number" min="1" value="23131" required>
    <button type="submit" id="review-button">Run staged review</button>
  </form>
  <pre id="review-output" aria-live="polite">No staged review yet.</pre>
  <h2>Answer</h2>
  <pre id="answer" aria-live="polite">Enter a question to begin.</pre>
  <h2>Tools executed</h2>
  <pre id="tools">—</pre>
  <script>
    const form = document.getElementById('ask-form');
    const button = document.getElementById('submit');
    const answer = document.getElementById('answer');
    const tools = document.getElementById('tools');
    const reviewForm = document.getElementById('review-form');
    const reviewButton = document.getElementById('review-button');
    const reviewOutput = document.getElementById('review-output');
    reviewForm.addEventListener('submit', async event => {
      event.preventDefault();
      reviewButton.disabled = true;
      reviewOutput.textContent = 'Running staged review…';
      try {
        const response = await fetch('/api/review', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            repo: document.getElementById('review-repo').value,
            number: Number(document.getElementById('review-number').value),
            provider: document.getElementById('provider').value
          })
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || 'Review request failed');
        reviewOutput.textContent = JSON.stringify(body, null, 2);
      } catch (error) {
        reviewOutput.textContent = String(error);
      } finally {
        reviewButton.disabled = false;
      }
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      answer.textContent = 'Running…';
      tools.textContent = '—';
      try {
        const response = await fetch('/api/ask', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question: document.getElementById('question').value, provider: document.getElementById('provider').value})
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || 'Request failed');
        answer.textContent = body.answer;
        tools.textContent = JSON.stringify(body.tools, null, 2);
      } catch (error) {
        answer.textContent = String(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
