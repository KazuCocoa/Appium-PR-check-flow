<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appium PR Check Flow</title>
  <link rel="stylesheet" href="/static/review.css">
  <script src="/static/review.js" defer></script>
</head>
<body>
  <header><b>Appium</b><span> / </span>PR Check Flow</header>
  <main>
    <h1>Pull request review</h1>
    <form id="run">
      <label>Provider<select id="provider"><option value="ollama">Ollama (local)</option><option value="openai">OpenAI API</option></select></label>
      <label>Workflow<select id="mode"><option value="staged">Staged multi-agent review</option><option value="single">Single agent</option></select></label>
      <fieldset id="target">
        <label>Repository<input id="repo" required pattern="[A-Za-z0-9_.\-]+/[A-Za-z0-9_.\-]+" value="appium/appium"></label>
        <label>PR number<input id="number" type="number" required min="1" placeholder="23131"></label>
      </fieldset>
      <label id="ask" hidden>Question<textarea id="question" maxlength="2000" rows="3" required disabled>Summarize the open PRs in appium/appium</textarea></label>
      <button id="submit">Run review</button>
    </form>
    <p id="status" role="status">Choose a pull request to begin.</p>
    <section id="result" hidden>
      <h2>Review report</h2>
      <div id="coverage"></div>
      <article id="report"></article>
      <h2>Execution trace</h2>
      <ol id="trace"></ol>
      <details><summary>Structured JSON</summary><pre id="json"></pre></details>
    </section>
  </main>
</body>
</html>
